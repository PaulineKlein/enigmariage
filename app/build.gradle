plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.kotlin.compose)
}

Properties properties = new Properties()
if (project.rootProject.file('local.properties').canRead()) {
    properties.load(project.rootProject.file("local.properties").newDataInputStream())
}

android {
    compileSdk 37
    namespace "com.pklein.mariage"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }

    signingConfigs {
        release {
            storeFile file(properties.getProperty("STORE_FILE") ?: "myFile")
            storePassword properties.getProperty("STORE_PASSWORD" ?: "myPwd")
            keyAlias properties.getProperty("KEY_ALIAS" ?: "myAlias")
            keyPassword properties.getProperty("KEY_PASSWORD" ?: "myPwd")
        }
    }

    defaultConfig {
        applicationId "com.pklein.enigmariage"
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 8
        versionName "3.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".ci"
            signingConfig signingConfigs.release
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
        }
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            enableUnitTestCoverage false
            enableAndroidTestCoverage false
            manifestPlaceholders = [crashlyticsCollectionEnabled: "true"]
        }
    }
}

afterEvaluate {
    tasks.named('processDebugGoogleServices').configure { enabled = false }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.viewpager2
    implementation libs.kotlin.reflect
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso

    //composants graphiques :
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.google.material
    implementation libs.airbnb.lottie
    implementation libs.airbnb.lottie.compose
    implementation libs.apache.commons.lang3
    implementation(libs.activity.ktx)

    // image zoom :
    implementation libs.stfalcon.imageviewer

    // dependency injection :
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // firebase :
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.crashlytics

    // compose :
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    debugImplementation libs.androidx.compose.ui.tooling

}
