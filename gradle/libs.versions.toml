[versions]
kotlin = "2.3.10"
androidGradlePlugin = "8.13.2"
appcompat = "1.7.1"
coreKtx = "1.17.0"
activityKtx = "1.12.4"
cardview = "1.0.0"
constraintlayout = "2.2.1"
material = "1.13.0"
lottie = "6.7.1"
commonsLang3 = "3.20.0"
stfalconImageViewer = "1.0.1"
junit = "4.13.2"
junitExt = "1.3.0"
espresso = "3.7.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
airbnb-lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
stfalcon-imageviewer = { module = "com.github.stfalcon-studio:StfalconImageViewer", version.ref = "stfalconImageViewer" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
